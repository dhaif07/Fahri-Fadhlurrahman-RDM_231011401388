    async function analyzeTextWithGemini(inputText) {
      const lower = inputText.toLowerCase();
      let sentiment = "Netral";
      let score = 0.78;
      let emotion = "Biasa saja 😐";
      let topic = "Sosialisasi Sensus";
      let bps_recommendation = "Tingkatkan sosialisasi edukatif langsung di kantong-kantong UMKM Tangsel.";

      if (lower.includes("bagus") || lower.includes("ramah") || lower.includes("mudah") || lower.includes("membantu") || lower.includes("senang") || lower.includes("mantap")) {
        sentiment = "Positif";
        score = 0.92;
        emotion = "Sangat Puas 😍";
        topic = "Kepuasan Layanan Sensus";
        bps_recommendation = "Pertahankan keramahan dan standar transparansi petugas sensus di lapangan.";
      } else if (lower.includes("takut") || lower.includes("bocor") || lower.includes("lambat") || lower.includes("sulit") || lower.includes("pajak") || lower.includes("kurang")) {
        sentiment = "Negatif";
        score = 0.85;
        emotion = "Khawatir 😟";
        topic = "Keamanan Data & Privasi";
        bps_recommendation = "Lakukan edukasi masif bahwa data Sensus Ekonomi dijamin UU No. 16/1997 dan tidak akan dibagikan ke instansi pajak.";
      }

      return {
        sentiment,
        score,
        emotion,
        topic,
        summary: `Sentimen terdeteksi sebagai ${sentiment} berdasarkan analisis kata kunci kontekstual warga Tangsel.`,
        bps_recommendation
      };
    }

                      <option value="Pondok Aren">Pondok Aren</option>
                      <option value="Ciputat">Ciputat</option>
                      <option value="Setu">Setu</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-2">Pendapat Warga:</label>
                    <textarea
                      rows={4}
                      value={aiInputText}
                      onChange={(e) => setAiInputText(e.target.value)}
                      placeholder="Masukkan komentar warga mengenai sensus ekonomi..."
                      className="w-full p-4 rounded-2xl border border-slate-200 text-sm bg-slate-50"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={aiAnalyzing || !aiInputText.trim()}
                    className="w-full py-3 bg-purple-600 text-white font-bold text-sm rounded-2xl shadow-md hover:bg-purple-700"
                  >
                    {aiAnalyzing ? "Menganalisis Teks..." : "Proses Analisis Sentimen"}
                  </button>
                </form>

                {aiResult && (
                  <div className="p-5 bg-slate-50 rounded-2xl border border-purple-200 space-y-3">
                    <div className="flex justify-between items-center font-bold text-xs">
                      <span className="px-3 py-1 bg-purple-100 text-purple-800 rounded-full">Sentimen: {aiResult.sentiment}</span>
                      <span>Emosi: {aiResult.emotion}</span>
                    </div>
                    <p className="text-xs text-slate-600 font-semibold">Topik: {aiResult.topic}</p>
                    <p className="text-sm text-slate-800">{aiResult.summary}</p>
                    <button
                      onClick={handleAddAiResultToFeed}
                      className="w-full py-2.5 bg-emerald-600 text-white text-xs font-bold rounded-xl"
                    >
                      Tambahkan ke Feed Utama
                    </button>
                  </div>
                )}
              </div>
            )}

            {/* Tab: Apify Scraper */}
            {activeTab === 'apify' && (
              <div className="max-w-4xl mx-auto bg-white p-6 rounded-3xl border border-slate-100 shadow-lg space-y-6">
                <div className="flex justify-between items-center">
                  <h3 className="text-xl font-bold text-slate-800">Apify Scraper Engine</h3>
                  <button
                    onClick={runApifyScraper}
                    disabled={apifyStatus === 'running'}
                    className="px-5 py-2.5 bg-emerald-600 text-white font-bold text-xs rounded-2xl"
                  >
                    {apifyStatus === 'running' ? "Mengunduh Data..." : "Jalankan Apify Scraper"}
                  </button>
                </div>

                <div className="p-4 bg-slate-100 rounded-2xl text-xs space-y-1 font-mono">
                  <p><strong>User ID:</strong> {APIFY_USER_ID}</p>
                  <p><strong>API Token:</strong> {APIFY_TOKEN.substring(0, 20)}...</p>
                </div>

                <div className="bg-slate-900 text-emerald-400 p-4 rounded-2xl font-mono text-xs min-h-[180px]">
                  {apifyLogs.length === 0 ? "Terminal siap. Klik Jalankan Scraper untuk mulai." : apifyLogs.map((log, i) => <p key={i}>{log}</p>)}
                </div>
              </div>
            )}

            {/* Tab: Feed */}
            {activeTab === 'feed' && (
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                {filteredFeedbacks.map((item) => (
                  <div key={item.id} className="bg-white p-5 rounded-3xl border border-slate-100 shadow-sm space-y-3">
                    <div className="flex justify-between items-center text-xs">
                      <span className="font-bold text-purple-700">{item.author} ({item.kecamatan})</span>
                      <span className="px-2.5 py-1 bg-slate-100 font-bold rounded-full">{item.sentiment}</span>
                    </div>
                    <p className="text-sm text-slate-700">"{item.text}"</p>
                    <div className="text-[11px] text-slate-400 flex justify-between pt-2 border-t border-slate-50">
                      <span>Topik: {item.topic}</span>
                      <span>{item.date}</span>
                    </div>
                  </div>
                ))}
              </div>
            )}

          </main>

          {/* Modal Pembuat */}
          {showAuthorModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white max-w-sm w-full p-6 rounded-3xl text-center space-y-4">
                <div className="w-16 h-16 bg-purple-600 text-white font-bold rounded-full flex items-center justify-center mx-auto text-xl">
                  FF
                </div>
                <h3 className="font-bold text-slate-800 text-base">Fahri Fadhlurrahman Rendy Dhaif Muharram</h3>
                <p className="text-xs font-bold text-purple-600 bg-purple-50 py-1 px-3 rounded-full inline-block">
                  NIM: 231011401388
                </p>
                <p className="text-xs text-slate-500">Aplikasi Sentimen Masyarakat terhadap Sensus Ekonomi Tangsel 2026.</p>
                <button
                  onClick={() => setShowAuthorModal(false)}
                  className="w-full py-2.5 bg-purple-600 text-white text-xs font-bold rounded-2xl"
                >
                  Tutup
                </button>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="text-center text-xs text-slate-400 mt-12">
            SentiSensus Tangsel 2026 — Developed by <strong>Fahri Fadhlurrahman Rendy Dhaif Muharram</strong> (NIM: 231011401388)
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
